# Cloudflare Tunnel Configuration for SNAP-AI
#
# SETUP INSTRUCTIONS:
# 1. Install cloudflared: https://developers.cloudflare.com/cloudflare-one/connections/connect-networks/downloads/
# 2. Authenticate: cloudflared tunnel login
# 3. Create tunnel: cloudflared tunnel create snap-ai
# 4. Route DNS: cloudflared tunnel route dns snap-ai snap-ai.yourdomain.com
# 5. Copy credentials: cp ~/.cloudflared/<TUNNEL_ID>.json ./cloudflared/credentials.json
# 6. Update the 'tunnel' and 'hostname' values below
#
# Replace 'snap-ai.yourdomain.com' with your actual domain.
# Replace '<TUNNEL_ID>' with the ID returned by 'cloudflared tunnel create'.

tunnel: <TUNNEL_ID>
credentials-file: /etc/cloudflared/credentials.json

ingress:
  - hostname: snap-ai.yourdomain.com
    service: http://frontend:80
  - service: http_status:404
