# Development overrides — Windows-friendly (no GPU reservation)
# Usage: docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --build
#
# Parity with production (docker-compose.local-gpu.yml):
#   - Same API routes, env variable names, container naming
#   - Same worker concurrency=1 (sequential processing)
#   - Same max-tasks-per-child=50
#   - Model differs: Ollama (dev) vs vLLM (prod) — system behavior identical

services:
  # ===================
  # Ollama LLM Service (Development — CPU-only safe)
  # ===================
  # GPU reservation removed: fails on Windows without NVIDIA Container Toolkit.
  # On Linux with NVIDIA GPU, add deploy.resources.reservations back.
  ollama:
    image: ollama/ollama:latest
    container_name: snapai-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - snapai-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 12G
    environment:
      - OLLAMA_NUM_GPU=1
      - OLLAMA_GPU_MEMORY=5500 # Leave room for system

  # Override backend for development
  backend:
    environment:
      - ENVIRONMENT=development
      - OLLAMA_HOST=http://ollama:11434
      - OLLAMA_MODEL=qwen2.5:7b-instruct-q4_K_M
      - LLM_BACKEND=ollama
      - LOG_LEVEL=DEBUG
      - JWT_SECRET=${JWT_SECRET:-snapai-local-secret-2026}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-Pancreas123}
    volumes:
      - ./backend/app:/app/app # Hot reload (remove :ro)
      - ./prompts:/app/prompts
    depends_on:
      - ollama

  # Override worker for development — sequential processing
  worker:
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=1 --max-tasks-per-child=50
    environment:
      - ENVIRONMENT=development
      - OLLAMA_HOST=http://ollama:11434
      - OLLAMA_MODEL=qwen2.5:7b-instruct-q4_K_M
      - LLM_BACKEND=ollama
      - LOG_LEVEL=DEBUG
      - JWT_SECRET=${JWT_SECRET:-snapai-local-secret-2026}
    volumes:
      - ./backend/app:/app/app
      - ./prompts:/app/prompts
    depends_on:
      - ollama

volumes:
  ollama_data:
