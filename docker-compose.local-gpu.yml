# ===========================================
# Local GPU Deployment (DGX / AnyDesk)
# ===========================================
# Run the full SNAP-AI stack locally with vLLM on host GPU.
# vLLM runs OUTSIDE Docker (host has direct GPU access).
# Docker containers connect to it via host.docker.internal.
#
# Usage:
#   1. Start vLLM on host:  ./start-vllm.sh &
#   2. Start stack:         docker compose -f docker-compose.yml -f docker-compose.local-gpu.yml up -d --build
#   3. Open browser:        http://localhost:8080
#   4. Login:               admin / <ADMIN_PASSWORD from .env>
#
# Stop:
#   docker compose -f docker-compose.yml -f docker-compose.local-gpu.yml down
#   pkill -f 'vllm serve'
# ===========================================

services:
  # --- Disable Ollama (we use vLLM) ---
  # Replaced with a no-op container that exits immediately.
  # Cannot use profiles: [disabled] because it breaks depends_on in dev compose.
  ollama:
    image: busybox
    command: [ "true" ]
    restart: "no"
    ports: !reset []

  # --- Backend: connect to vLLM on host ---
  backend:
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - ENVIRONMENT=production
      - LLM_BACKEND=${LLM_BACKEND:-vllm}
      - VLLM_HOST=${VLLM_HOST:-http://host.docker.internal:8005}
      - VLLM_MODEL=${VLLM_MODEL:-openai/gpt-oss-120b}
      - LLM_MAX_TOKENS=${LLM_MAX_TOKENS:-16384}
      - LLM_TIMEOUT=900
      - LLM_REASONING_LEVEL=${LLM_REASONING_LEVEL:-low}
      # Live SSE must outlast a multi-hour batch (0 = unbounded). See CANONICAL_RUNTIME §6.
      - SSE_STREAM_TIMEOUT=${SSE_STREAM_TIMEOUT:-28800}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - API_WORKERS=4
      - JWT_SECRET=${JWT_SECRET:-snapai-local-secret-2026}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-Pancreas123}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-changeme}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-snapai_prod_2026}

  # --- Worker: connect to vLLM on host ---
  worker:
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Per-case fan-out: consume all three queues (cases + interactive + default coordinator).
    # --concurrency=2 is the START value; tune against measured single-GPU vLLM headroom
    # (TESTING_PLAN §4 / RISK_REGISTER R-7). --max-tasks-per-child now recycles per case.
    command: celery -A app.workers.celery_app worker --loglevel=info -Q cases,interactive,celery --concurrency=${WORKER_CONCURRENCY:-2} --max-tasks-per-child=50
    environment:
      - ENVIRONMENT=production
      - LLM_BACKEND=${LLM_BACKEND:-vllm}
      - VLLM_HOST=${VLLM_HOST:-http://host.docker.internal:8005}
      - VLLM_MODEL=${VLLM_MODEL:-openai/gpt-oss-120b}
      - LLM_MAX_TOKENS=${LLM_MAX_TOKENS:-16384}
      - LLM_TIMEOUT=900
      - LLM_REASONING_LEVEL=${LLM_REASONING_LEVEL:-low}
      # Kill-switch: set to 0 to fall back to the legacy sequential batch (rollback path).
      - BATCH_FANOUT_ENABLED=${BATCH_FANOUT_ENABLED:-1}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - JWT_SECRET=${JWT_SECRET:-snapai-local-secret-2026}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-changeme}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-snapai_prod_2026}

  # --- Frontend: expose on port 8080 ---
  frontend:
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    environment:
      - NODE_ENV=production

  # --- PostgreSQL hardening ---
  postgres:
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-snapai_prod_2026}

  # --- Redis hardening ---
  redis:
    command: redis-server --requirepass ${REDIS_PASSWORD:-changeme} --maxmemory 2gb --maxmemory-policy allkeys-lru
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-changeme}", "ping" ]
