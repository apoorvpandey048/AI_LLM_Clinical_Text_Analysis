# SNAP-AI Production Docker Compose — STANDALONE
# Deploy on DGX A100-40GB with GPT-OSS-120B
#
# Usage: docker compose -f docker-compose.prod.yml up -d --build
#
# Prerequisites:
#   - vLLM running on host: ./start-vllm.sh &
#   - NVIDIA drivers installed (525+)
#   - mkdir -p /raid/s3cache/$USER/huggingface
#   - Cloudflare tunnel token in .env
#
# IMPORTANT: Celery workers do NOT hot-reload.
# After changing tasks.py, pipeline code, or model integration:
#   docker compose -f docker-compose.prod.yml restart worker

services:
  # ===================
  # Backend API (Production)
  # ===================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: snapai-backend
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - ENVIRONMENT=production
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-snapai}
      - POSTGRES_USER=${POSTGRES_USER:-snapai}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-snapai_prod_2026}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-changeme}
      - LLM_BACKEND=vllm
      - VLLM_HOST=http://host.docker.internal:8000
      - VLLM_MODEL=${VLLM_MODEL:-openai/gpt-oss-120b}
      - LLM_TEMPERATURE=${LLM_TEMPERATURE:-0.0}
      - LLM_MAX_TOKENS=${LLM_MAX_TOKENS:-8192}
      - LLM_TIMEOUT=900
      - LLM_REASONING_LEVEL=${LLM_REASONING_LEVEL:-low}
      - JWT_SECRET=${JWT_SECRET:-snapai-production-secret-2026}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-snapai-admin-2026}
      - API_WORKERS=4
      - LOG_LEVEL=INFO
    volumes:
      - ./backend/app:/app/app:ro
      - ./prompts:/app/prompts:ro
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - snapai-network
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1" ]
      interval: 15s
      timeout: 10s
      start_period: 30s
      retries: 5

  # ===================
  # Celery Worker (Production — 2 concurrent)
  # IMPORTANT: Does NOT hot-reload. Restart after code changes:
  #   docker compose -f docker-compose.prod.yml restart worker
  # ===================
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: snapai-worker
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=2 --max-tasks-per-child=50
    environment:
      - ENVIRONMENT=production
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-snapai}
      - POSTGRES_USER=${POSTGRES_USER:-snapai}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-snapai_prod_2026}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-changeme}
      - LLM_BACKEND=vllm
      - VLLM_HOST=http://host.docker.internal:8000
      - VLLM_MODEL=${VLLM_MODEL:-openai/gpt-oss-120b}
      - LLM_TEMPERATURE=${LLM_TEMPERATURE:-0.0}
      - LLM_MAX_TOKENS=${LLM_MAX_TOKENS:-8192}
      - LLM_TIMEOUT=900
      - LLM_REASONING_LEVEL=${LLM_REASONING_LEVEL:-low}
      - JWT_SECRET=${JWT_SECRET:-snapai-production-secret-2026}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-snapai-admin-2026}
      - LOG_LEVEL=INFO
    healthcheck:
      test: [ "CMD-SHELL", "celery -A app.workers.celery_app inspect ping --timeout 10 2>/dev/null | grep -q 'pong' || exit 1" ]
      interval: 30s
      timeout: 15s
      start_period: 30s
      retries: 3
    volumes:
      - ./backend/app:/app/app:ro
      - ./prompts:/app/prompts:ro
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - snapai-network
    restart: unless-stopped

  # ===================
  # PostgreSQL Database (Hardened)
  # ===================
  postgres:
    image: postgres:15-alpine
    container_name: snapai-postgres
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-snapai}
      - POSTGRES_USER=${POSTGRES_USER:-snapai}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-snapai_prod_2026}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - snapai-network
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-snapai}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===================
  # Redis Message Broker (Hardened — password required)
  # ===================
  redis:
    image: redis:7-alpine
    container_name: snapai-redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-changeme} --maxmemory 2gb --maxmemory-policy allkeys-lru
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:-changeme}
    volumes:
      - redis_data:/data
    networks:
      - snapai-network
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-changeme}", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===================
  # Frontend (Production build)
  # ===================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: snapai-frontend
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    environment:
      - NODE_ENV=production
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - snapai-network
    restart: unless-stopped

  # ===================
  # Cloudflare Tunnel (Permanent URL)
  # ===================
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: snapai-tunnel
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN:-}
    networks:
      - snapai-network
    restart: unless-stopped
    depends_on:
      - frontend

# Note: vLLM runs on host (not Docker) due to rootless Docker GPU limitations.
# Start with: ./start-vllm.sh

networks:
  snapai-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  uploads_data:
