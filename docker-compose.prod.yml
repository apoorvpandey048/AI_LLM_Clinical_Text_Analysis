# Production deployment for DGX A100-40GB with GPT-OSS-120B
# Deploy on DGX-02 (dbe-sl21-02) — GPU 3 with single-GPU inference
# Model cache stored on /raid/s3cache/ to bypass 60GB home quota
#
# vLLM runs on HOST (not in Docker) because rootless Docker
# cannot pass GPUs to containers. Start it with: ./start-vllm.sh
#
# Usage:
#   1. ./start-vllm.sh &           (start vLLM on host with GPU)
#   2. docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Prerequisites:
#   - NVIDIA drivers installed (525+)
#   - mkdir -p /raid/s3cache/$USER/huggingface
#   - Cloudflare tunnel token in .env

services:
  # ===================
  # vLLM runs on HOST — disable Docker container
  # Start with: ./start-vllm.sh
  # ===================
  vllm:
    image: busybox
    command: ["true"]
    profiles:
      - disabled

  # Disable Ollama in production
  ollama:
    image: busybox
    command: ["true"]
    profiles:
      - disabled

  # Override backend for production
  # vLLM runs on host — connect via host.docker.internal
  backend:
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - ENVIRONMENT=production
      - LLM_BACKEND=vllm
      - VLLM_HOST=http://host.docker.internal:8000
      - VLLM_MODEL=openai/gpt-oss-120b
      - LLM_MAX_TOKENS=${LLM_MAX_TOKENS:-8192}
      - LLM_TIMEOUT=900
      - LOG_LEVEL=INFO
      - API_WORKERS=4
      - JWT_SECRET=${JWT_SECRET:-snapai-production-secret-2026}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-snapai-admin-2026}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-changeme}

  # Override worker for production
  worker:
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=2 --max-tasks-per-child=50
    environment:
      - ENVIRONMENT=production
      - LLM_BACKEND=vllm
      - VLLM_HOST=http://host.docker.internal:8000
      - VLLM_MODEL=openai/gpt-oss-120b
      - LLM_MAX_TOKENS=${LLM_MAX_TOKENS:-8192}
      - LLM_TIMEOUT=900
      - LOG_LEVEL=INFO
      - JWT_SECRET=${JWT_SECRET:-snapai-production-secret-2026}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-changeme}

  # Production frontend
  frontend:
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    environment:
      - NODE_ENV=production

  # ===================
  # Cloudflare Tunnel (Permanent URL)
  # ===================
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: snapai-tunnel
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN:-}
    networks:
      - snapai-network
    restart: unless-stopped
    depends_on:
      - frontend

  # PostgreSQL hardening
  postgres:
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-snapai_prod_2026}

  # Redis hardening
  redis:
    command: redis-server --requirepass ${REDIS_PASSWORD:-changeme} --maxmemory 2gb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-changeme}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

# Note: vLLM runs on host (not Docker) due to rootless Docker GPU limitations
# Start with: ./start-vllm.sh
