# Remote deployment overlay for Ubuntu server with 8x NVIDIA A100 GPUs
# Usage: docker-compose -f docker-compose.yml -f docker-compose.remote.yml up -d
#
# Prerequisites:
#   - NVIDIA drivers installed (525+)
#   - NVIDIA Container Toolkit installed
#   - Docker + Docker Compose installed
#   - .env file configured with production settings

version: '3.8'

services:
  # ===================
  # Ollama LLM Service (Multi-GPU)
  # ===================
  ollama:
    image: ollama/ollama:latest
    container_name: snapai-ollama
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - snapai-network
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [ gpu ]
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - OLLAMA_NUM_PARALLEL=4
      - OLLAMA_MAX_LOADED_MODELS=2
      - OLLAMA_KEEP_ALIVE=10m

  # ===================
  # Backend API (Production)
  # ===================
  backend:
    environment:
      - ENVIRONMENT=production
      - OLLAMA_HOST=http://ollama:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-me-llama:70b-chat}
      - LLM_BACKEND=ollama
      - LOG_LEVEL=INFO
      - API_WORKERS=4
    depends_on:
      - ollama
    ports:
      - "127.0.0.1:8000:8000"

  # ===================
  # Celery Worker (High Concurrency)
  # ===================
  worker:
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=8 --max-tasks-per-child=50
    environment:
      - ENVIRONMENT=production
      - OLLAMA_HOST=http://ollama:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-me-llama:70b-chat}
      - LLM_BACKEND=ollama
      - LOG_LEVEL=INFO
    depends_on:
      - ollama

  # ===================
  # Frontend (Nginx reverse proxy + static)
  # ===================
  frontend:
    ports:
      - "80:80"
      - "443:443"
    environment:
      - NODE_ENV=production
    volumes:
      - ./ssl:/etc/nginx/ssl:ro

  # ===================
  # PostgreSQL hardening
  # ===================
  postgres:
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"

  # ===================
  # Redis hardening
  # ===================
  redis:
    command: redis-server --requirepass ${REDIS_PASSWORD:-} --maxmemory 2gb --maxmemory-policy allkeys-lru
    ports:
      - "127.0.0.1:6379:6379"

volumes:
  ollama_data:
