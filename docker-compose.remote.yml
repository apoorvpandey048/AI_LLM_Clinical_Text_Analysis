# ⛔ DEPRECATED for the excel-batch-fanout line of work — DO NOT use.
#    Runs Ollama IN Docker with a GPU reservation, which contradicts the canonical "vLLM on the
#    host GPU" runtime (docs/excel-batch-fanout/CANONICAL_RUNTIME.md §3). Retained for history.
#
# Remote/DGX deployment overlay
# Usage: docker compose -f docker-compose.yml -f docker-compose.remote.yml up -d --build
#
# Prerequisites:
#   - NVIDIA drivers installed (525+)
#   - NVIDIA Container Toolkit installed
#   - Docker + Docker Compose installed
#   - .env file configured (copy from .env.example)

services:
  # ===================
  # Ollama LLM Service (GPU)
  # ===================
  ollama:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]
    environment:
      - NVIDIA_VISIBLE_DEVICES=${NVIDIA_VISIBLE_DEVICES:-all}
      - OLLAMA_NUM_PARALLEL=2
      - OLLAMA_MAX_LOADED_MODELS=1
      - OLLAMA_KEEP_ALIVE=10m

  # ===================
  # Backend API (Production)
  # ===================
  backend:
    environment:
      - ENVIRONMENT=production
      - OLLAMA_HOST=http://ollama:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen2.5:14b-instruct-q4_K_M}
      - LLM_BACKEND=${LLM_BACKEND:-vllm}
      - VLLM_HOST=${VLLM_HOST:-http://host.docker.internal:8000}
      - VLLM_MODEL=${VLLM_MODEL:-openai/gpt-oss-120b}
      - LLM_MAX_TOKENS=${LLM_MAX_TOKENS:-16384}
      - LLM_TIMEOUT=${LLM_TIMEOUT:-900}
      - LLM_REASONING_LEVEL=${LLM_REASONING_LEVEL:-low}
      - LOG_LEVEL=INFO
      - API_WORKERS=4
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
    depends_on:
      - ollama

  # ===================
  # Celery Worker
  # ===================
  worker:
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=2 --max-tasks-per-child=50
    environment:
      - ENVIRONMENT=production
      - OLLAMA_HOST=http://ollama:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen2.5:14b-instruct-q4_K_M}
      - LLM_BACKEND=${LLM_BACKEND:-vllm}
      - VLLM_HOST=${VLLM_HOST:-http://host.docker.internal:8000}
      - VLLM_MODEL=${VLLM_MODEL:-openai/gpt-oss-120b}
      - LLM_MAX_TOKENS=${LLM_MAX_TOKENS:-16384}
      - LLM_TIMEOUT=${LLM_TIMEOUT:-900}
      - LLM_REASONING_LEVEL=${LLM_REASONING_LEVEL:-low}
      - LOG_LEVEL=INFO
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
    depends_on:
      - ollama

  # ===================
  # Frontend (Nginx reverse proxy + static)
  # ===================
  frontend:
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    environment:
      - NODE_ENV=production

  # ===================
  # PostgreSQL hardening
  # ===================
  postgres:
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}

  # ===================
  # Redis hardening
  # ===================
  redis:
    command: redis-server --requirepass ${REDIS_PASSWORD:-changeme} --maxmemory 2gb --maxmemory-policy allkeys-lru
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-changeme}", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
