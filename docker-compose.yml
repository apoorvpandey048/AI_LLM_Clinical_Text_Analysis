services:
  # ===================
  # Backend API
  # ===================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: snapai-backend
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - POSTGRES_HOST=${POSTGRES_HOST:-postgres}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - POSTGRES_DB=${POSTGRES_DB:-snapai}
      - POSTGRES_USER=${POSTGRES_USER:-snapai}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-snapai_dev}
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - OLLAMA_HOST=${OLLAMA_HOST:-http://ollama:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen2.5:7b-instruct-q4_K_M}
      - LLM_BACKEND=${LLM_BACKEND:-ollama}
      - VLLM_HOST=${VLLM_HOST:-http://vllm:8000}
      - VLLM_MODEL=${VLLM_MODEL:-openai/gpt-oss-120b}
      - LLM_TEMPERATURE=${LLM_TEMPERATURE:-0.0}
      - LLM_MAX_TOKENS=${LLM_MAX_TOKENS:-8192}
      - LLM_TIMEOUT=${LLM_TIMEOUT:-900}
      - JWT_SECRET=${JWT_SECRET:-snapai-change-this-in-production-2026}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-snapai-admin-2026}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      - ./backend/app:/app/app:ro
      - ./prompts:/app/prompts:ro
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - snapai-network
    restart: unless-stopped

  # ===================
  # Celery Worker
  # ===================
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: snapai-worker
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=2
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - POSTGRES_HOST=${POSTGRES_HOST:-postgres}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - POSTGRES_DB=${POSTGRES_DB:-snapai}
      - POSTGRES_USER=${POSTGRES_USER:-snapai}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-snapai_dev}
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - OLLAMA_HOST=${OLLAMA_HOST:-http://ollama:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen2.5:7b-instruct-q4_K_M}
      - LLM_BACKEND=${LLM_BACKEND:-ollama}
      - VLLM_HOST=${VLLM_HOST:-http://vllm:8000}
      - VLLM_MODEL=${VLLM_MODEL:-openai/gpt-oss-120b}
      - LLM_TEMPERATURE=${LLM_TEMPERATURE:-0.0}
      - LLM_MAX_TOKENS=${LLM_MAX_TOKENS:-8192}
      - LLM_TIMEOUT=${LLM_TIMEOUT:-900}
      - JWT_SECRET=${JWT_SECRET:-snapai-change-this-in-production-2026}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-snapai-admin-2026}
    # Override healthcheck - Celery worker has no HTTP server
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.workers.celery_app inspect ping --timeout 10 2>/dev/null | grep -q 'pong' || exit 1"]
      interval: 30s
      timeout: 15s
      start_period: 30s
      retries: 3
    volumes:
      - ./backend/app:/app/app:ro
      - ./prompts:/app/prompts:ro
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - snapai-network
    restart: unless-stopped

  # ===================
  # PostgreSQL Database
  # ===================
  postgres:
    image: postgres:15-alpine
    container_name: snapai-postgres
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-snapai}
      - POSTGRES_USER=${POSTGRES_USER:-snapai}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-snapai_dev}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - snapai-network
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-snapai}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===================
  # Redis Message Broker
  # ===================
  redis:
    image: redis:7-alpine
    container_name: snapai-redis
    command:
      sh -c '
        if [ -n "$$REDIS_PASSWORD" ]; then
          exec redis-server --requirepass "$$REDIS_PASSWORD" --maxmemory 2gb --maxmemory-policy allkeys-lru;
        else
          exec redis-server --maxmemory 2gb --maxmemory-policy allkeys-lru;
        fi
      '
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
    volumes:
      - redis_data:/data
    networks:
      - snapai-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "if [ -n \"$$REDIS_PASSWORD\" ]; then redis-cli -a \"$$REDIS_PASSWORD\" ping; else redis-cli ping; fi"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===================
  # Ollama (LLM Backend)
  # ===================
  ollama:
    image: ollama/ollama:latest
    container_name: snapai-ollama
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - snapai-network
    restart: unless-stopped
    # Note: For GPU support, uncomment deploy section below on NVIDIA systems
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

    # ===================
    # Frontend
    # ===================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: snapai-frontend
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - snapai-network
    restart: unless-stopped

networks:
  snapai-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  uploads_data:
  ollama_data:
