<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="SNAP-AI Clinical NLP Pipeline for German Discharge Summaries">
    <title>SNAP-AI | Clinical NLP Pipeline</title>
    <link rel="stylesheet" href="/src/styles.css">
</head>
<body>
    <div id="app">
        <!-- Header -->
        <header class="header">
            <div class="header-content">
                <div class="logo">
                    <span class="logo-icon">
                        <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M11 2a2 2 0 0 0-2 2v5H4a2 2 0 0 0-2 2v2c0 1.1.9 2 2 2h5v5c0 1.1.9 2 2 2h2a2 2 0 0 0 2-2v-5h5a2 2 0 0 0 2-2v-2a2 2 0 0 0-2-2h-5V4a2 2 0 0 0-2-2h-2z"/>
                        </svg>
                    </span>
                    <h1>SNAP-AI</h1>
                </div>
                <p class="tagline">Clinical NLP Pipeline for Complication Analysis</p>
            </div>
        </header>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Upload Section -->
            <section id="upload-section" class="card">
                <h2>
                    <svg class="section-icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/>
                        <polyline points="14 2 14 8 20 8"/>
                        <line x1="16" x2="8" y1="13" y2="13"/>
                        <line x1="16" x2="8" y1="17" y2="17"/>
                        <line x1="10" x2="8" y1="9" y2="9"/>
                    </svg>
                    Upload Clinical Cases
                </h2>
                <p class="section-description">Upload a DOCX file or paste clinical text directly.</p>
                
                <!-- Tab Navigation -->
                <div class="tab-nav">
                    <button class="tab-btn active" data-tab="file">File Upload</button>
                    <button class="tab-btn" data-tab="text">Direct Text</button>
                </div>

                <!-- File Upload Tab -->
                <div id="file-tab" class="tab-content active">
                    <div class="dropzone" id="dropzone">
                        <div class="dropzone-content">
                            <span class="dropzone-icon">
                                <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                                    <polyline points="17 8 12 3 7 8"/>
                                    <line x1="12" x2="12" y1="3" y2="15"/>
                                </svg>
                            </span>
                            <p>Drag & drop DOCX file here</p>
                            <p class="dropzone-hint">or click to browse</p>
                            <input type="file" id="file-input" accept=".docx" hidden>
                        </div>
                    </div>
                    <div id="file-info" class="file-info hidden"></div>
                </div>

                <!-- Text Input Tab -->
                <div id="text-tab" class="tab-content">
                    <textarea 
                        id="text-input" 
                        class="text-input" 
                        placeholder="Paste clinical text here...

Cases should be separated by headers like 'Case #1', 'Case #2', etc."
                        rows="12"
                    ></textarea>
                </div>

                <!-- Process Button -->
                <button id="process-btn" class="btn btn-primary btn-large" disabled>
                    <svg class="btn-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polygon points="5 3 19 12 5 21 5 3"/>
                    </svg>
                    Process Cases
                </button>
            </section>

            <!-- Progress Section (Hidden by default) -->
            <section id="progress-section" class="card hidden">
                <h2>
                    <svg class="section-icon spinning" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 12a9 9 0 1 1-6.219-8.56"/>
                    </svg>
                    Processing...
                </h2>
                
                <!-- Overall Progress -->
                <div class="progress-overall">
                    <div class="progress-bar">
                        <div class="progress-fill" id="progress-fill" style="width: 0%"></div>
                    </div>
                    <p class="progress-text" id="progress-text">0 of 0 cases completed</p>
                </div>

                <!-- Per-Case Status -->
                <div class="case-status-list" id="case-status-list">
                    <!-- Populated dynamically -->
                </div>
            </section>

            <!-- Results Section (Hidden by default) -->
            <section id="results-section" class="card hidden">
                <h2>
                    <svg class="section-icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="18" x2="18" y1="20" y2="10"/>
                        <line x1="12" x2="12" y1="20" y2="4"/>
                        <line x1="6" x2="6" y1="20" y2="14"/>
                    </svg>
                    Results
                </h2>
                
                <!-- Summary Stats -->
                <div class="results-summary" id="results-summary">
                    <!-- Populated dynamically -->
                </div>

                <!-- Case Results List -->
                <div class="case-results" id="case-results">
                    <!-- Populated dynamically -->
                </div>

                <!-- Export Button -->
                <div class="export-actions">
                    <button id="export-btn" class="btn btn-secondary">
                        <svg class="btn-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                            <polyline points="7 10 12 15 17 10"/>
                            <line x1="12" x2="12" y1="15" y2="3"/>
                        </svg>
                        Export JSON
                    </button>
                    <button id="new-analysis-btn" class="btn btn-outline">
                        <svg class="btn-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/>
                            <path d="M21 3v5h-5"/>
                            <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/>
                            <path d="M8 16H3v5"/>
                        </svg>
                        New Analysis
                    </button>
                </div>
            </section>
        </main>

        <!-- Footer -->
        <footer class="footer">
            <p>SNAP-AI v1.0.0 | Secure On-Premise Clinical NLP</p>
        </footer>
    </div>

    <script type="module" src="/src/main.js"></script>
</body>
</html>
